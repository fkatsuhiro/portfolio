version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
          - "@axe-core/*"
      firebase:
        patterns:
          - "firebase"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
